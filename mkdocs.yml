site_name: Xitzin
site_description: A Gemini Application framework
site_url: https://xitzin.readthedocs.io
repo_url: https://github.com/alanbato/xitzin
repo_name: alanbato/xitzin
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.view
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Tutorials:
      - tutorials/index.md
      - Your First Capsule: tutorials/your-first-capsule.md
      - Handling User Input: tutorials/handling-user-input.md
      - User Authentication: tutorials/user-authentication.md
      - Building a Guestbook: tutorials/building-a-guestbook.md
  - How-to Guides:
      - how-to/index.md
      - Routing: how-to/routing.md
      - Input Handling: how-to/input-handling.md
      - Responses: how-to/responses.md
      - Templates: how-to/templates.md
      - Middleware: how-to/middleware.md
      - Background Tasks: how-to/background-tasks.md
      - Authentication: how-to/authentication.md
      - Database Migrations: how-to/database-migrations.md
      - CGI Scripts: how-to/cgi-scripts.md
      - SCGI Backends: how-to/scgi-backends.md
      - Error Handling: how-to/error-handling.md
      - Testing: how-to/testing.md
      - Deployment: how-to/deployment.md
  - Explanation:
      - explanation/index.md
      - Gemini Protocol: explanation/gemini-protocol.md
      - Architecture: explanation/architecture.md
      - Request Lifecycle: explanation/request-lifecycle.md
      - Comparison to FastAPI: explanation/comparison-to-fastapi.md
      - Gemtext Format: explanation/gemtext-format.md
  - Reference:
      - reference/index.md
      - Application: reference/application.md
      - Requests: reference/requests.md
      - Responses: reference/responses.md
      - Routing: reference/routing.md
      - Tasks: reference/tasks.md
      - CGI: reference/cgi.md
      - SCGI: reference/scgi.md
      - Exceptions: reference/exceptions.md
      - Middleware: reference/middleware.md
      - Authentication: reference/auth.md
      - Templating: reference/templating.md
      - Testing: reference/testing.md
      - SQLModel: reference/sqlmodel.md
  - Changelog: changelog.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alanbato/xitzin
  version:
    provider: mike
